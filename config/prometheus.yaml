# Prometheus 监控配置
prometheus:
  # 总开关：为 false 时不注册 /metrics，也不挂载 PrometheusMiddleware。
  enabled: true

  # 指标暴露路径。保持默认即可，Prometheus 采集器的 scrape_configs 需要与之一致。
  path: "/metrics"

  # 指标命名前缀与服务名。影响所有自动注册的指标，确认后不要随意改动。
  service_name: "thinkgin"
  namespace: "app"

  # 分模块启停：关掉某个模块就不会注册对应指标。
  metrics:
    # HTTP 四维：requests_total / request_duration / request_size / response_size
    http:
      enabled: true
      # 是否在标签里包含完整 URL 路径。
      # 警告：动态路径（如 /users/:id）会造成 label cardinality 爆炸，生产务必为 false。
      include_path: false

    # 系统指标：进程内存、启动时间。CPU 使用率需要 gopsutil 外部依赖，暂不提供。
    system:
      enabled: true

    # 业务指标：middleware.BusinessCounter / BusinessHistogram / BusinessGauge
    business:
      enabled: true

  # /metrics 端点 Basic Auth 鉴权（生产环境强烈建议启用）。
  # 启用后，Prometheus 采集器的 scrape_configs 需要配置对应的 basic_auth。
  # 注意：不要在此明文写生产密码并提交仓库，建议仅在内网/受控环境暴露 /metrics，
  # 或通过反向代理（Nginx/Ingress）统一做鉴权与网络隔离。
  auth:
    enabled: false
    username: ""
    password: ""
