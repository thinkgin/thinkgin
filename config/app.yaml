# 应用配置
app:
  name: "ThinkGin"
  version: "3.13.0"
  debug: true
  timezone: "Asia/Shanghai"
  locale: "zh-CN"

  # JWT 配置
  jwt:
    # 安全提示：不要把密钥明文写在这里并提交到仓库。
    # 生产环境请通过环境变量注入：THINKGIN_APP_JWT_SECRET=<至少32位随机字符串>
    # 留空时框架拒绝签发/校验 JWT（JWTIssue/JWTAuth 返回错误）。
    secret: ""
    expire: 7200 # 2小时，单位秒

  # 分页配置
  pagination:
    page_size: 20
    max_page_size: 100

  # 监控配置
  monitoring:
    # 普罗米修斯监控总开关
    prometheus_enabled: true
