# 数据库配置
#
# 默认情况下不预置任何连接，框架以"纯 HTTP 应用"形态启动，不报任何依赖告警。
# 需要接入数据库 / Redis 时，把下方示例块从注释里放出来并改写成真实值即可。
database:
  # 默认连接名；connections 中必须存在对应条目才会被 database.Default() 命中。
  default: "mysql"

  # 命名连接表。示例都在注释里，按需打开。
  connections: {}

  # ---------- 下面是可复制粘贴的示例 ----------
  #
  # connections:
  #   mysql:
  #     driver: "mysql"
  #     host: "127.0.0.1"
  #     port: 3306
  #     database: "thinkgin"
  #     username: "thinkgin"
  #     password: "thinkgin"
  #     charset: "utf8mb4"
  #     collation: "utf8mb4_unicode_ci"
  #     table_prefix: "tg_"
  #     pool:
  #       max_open: 100
  #       max_idle: 10
  #       max_lifetime: 3600
  #     timeout:
  #       connect: 10
  #       read: 30
  #       write: 30
  #
  #   pgsql:
  #     driver: "postgres"
  #     host: "127.0.0.1"
  #     port: 5432
  #     database: "thinkgin"
  #     username: "postgres"
  #     password: "password"
  #     sslmode: "disable"
  #     table_prefix: "tg_"
  #
  #   sqlite:
  #     driver: "sqlite3"
  #     database: "database/thinkgin.db"
  #     table_prefix: "tg_"
  #
  #   redis:
  #     driver: "redis"
  #     host: "127.0.0.1"
  #     port: 6379
  #     password: ""
  #     database: 0
  #     pool_size: 10
