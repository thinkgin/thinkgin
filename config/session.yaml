# Session 配置
session:
  # 驱动类型：memory（默认，单进程）或 redis（多实例共享）。
  driver: "memory"

  # Cookie 名称
  name: "THINKGIN_SESSION"

  # 生存时间（秒）
  lifetime: 7200

  # 使用 redis driver 时引用的连接（对应 database.yaml 的 connections.<name>）
  redis:
    connection: "redis"

  # Cookie 安全属性
  cookie:
    path: "/"
    domain: ""
    # secure: 仅通过 HTTPS 传输 Cookie。本地 HTTP 开发设为 false；生产部署务必置 true。
    secure: false
    # http_only: 已由框架强制为 true（Session ID 不允许被 JS 读取），此处配置仅作说明。
    http_only: true
    same_site: "lax" # lax / strict / none
