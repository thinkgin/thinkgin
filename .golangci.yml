# golangci-lint v2 配置。
# 原则：启用能暴露真实 bug 的 linter，关闭格式/主观偏好类。
# v1 -> v2 变化：顶层 version、gosimple 合并进 staticcheck、
# exclude-rules 迁移到 issues.exclusions.rules。

version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck      # 未处理的 error
    - govet         # 官方静态分析（含 shadow、printf 等）
    - ineffassign   # 无效赋值
    - staticcheck   # 强大的 bug 检测（已包含 v1 的 gosimple）
    - unused        # 死代码
    - misspell      # 拼写错误
    - unconvert     # 不必要的类型转换
    - bodyclose     # http 响应 body 未关闭
    - contextcheck  # context 传递检查
    - rowserrcheck  # sql.Rows.Err 未检查

  settings:
    misspell:
      locale: US
    errcheck:
      exclude-functions:
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - (*github.com/sirupsen/logrus.Logger).Info
        - (*github.com/sirupsen/logrus.Logger).Warn

  exclusions:
    rules:
      # 测试文件放宽 errcheck，允许快速写测试
      - path: _test\.go
        linters: [errcheck]

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
